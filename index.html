<!doctype html>
<html lang="am">
 <head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DaraBingo Shared</title>
  <style>
*{box-sizing:border-box}body{margin:0;background:#101827;color:white;font-family:Arial;text-align:center}header{background:#087f5b;padding:18px;font-size:28px;font-weight:bold}main{max-width:800px;margin:auto;padding:12px}.card{background:#1d293b;padding:16px;border-radius:14px;margin:14px auto}input{display:block;width:100%;max-width:400px;padding:12px;margin:10px auto;font-size:16px}button{padding:11px 14px;margin:5px;border:0;border-radius:8px;background:#10b981;font-weight:bold;font-size:15px}.secondary{background:#475569;color:white}.hidden{display:none!important}.small{color:#bdc8d8;font-size:13px}.grid,.head{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;max-width:500px;margin:12px auto}.head{color:#a7f3d0;font-weight:bold}.cell{aspect-ratio:1;background:#334155;color:white;font-size:clamp(14px,4vw,22px);padding:4px;margin:0}.marked{background:#10b981;color:#062014}.free{background:#fbbf24;color:#422006}.numbers{display:flex;flex-wrap:wrap;justify-content:center;gap:5px}.ball{padding:7px;background:#334155;border-radius:7px}
</style>
 </head>
 <body>
  <header>🎱 DaraBingo</header>
  <main>
   <section id="auth" class="card">
    <h2>ወደ DaraBingo ይግቡ</h2>
    <input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password (6+ characters)">
    <button id="signup">መለያ ፍጠር</button>
    <button id="login">ግባ</button>
    <p id="authMsg" class="small"></p>
   </section>
   <section id="game" class="hidden">
    <div class="card">
     <h2 id="welcome">DaraBingo</h2>
     <button id="logout" class="secondary">ውጣ</button>
     <p>የጋራ ጨዋታ ኮድ: <b>DARA01</b></p>
     <p id="roomStatus">የጨዋታ ሁኔታ፦ እየተገናኘ ነው…</p>
     <p id="players" class="small"></p>
     <p id="lastCall">የመጨረሻ ቁጥር፦ —</p>
     <div id="called" class="numbers"></div>
     <p id="adminMsg" class="small"></p>
     <button id="start" class="hidden">ጨዋታ ጀምር</button>
     <button id="call" class="hidden">ቀጣይ ቁጥር ጥራ</button>
     <button id="reset" class="secondary hidden">ዳግም ጀምር</button>
     <p class="small">የማሳያ ጨዋታ ብቻ፤ እውነተኛ ገንዘብ አይጠቀምም።</p>
    </div>
    <div class="card">
     <h3>የእርስዎ Bingo ካርድ</h3>
     <div class="head">
      <span>B</span><span>I</span><span>N</span><span>G</span><span>O</span>
     </div>
     <div id="grid" class="grid"></div>
     <button id="newCard" class="secondary">አዲስ ካርድ</button>
     <button id="check">Bingo አረጋግጥ</button>
     <p id="message" class="small">የተጠሩ ቁጥሮችን ምልክት ያድርጉ።</p>
    </div>
   </section>
  </main>
  <script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
import{getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";
import{getDatabase,ref,get,set,update,onValue,runTransaction}from"https://www.gstatic.com/firebasejs/12.4.0/firebase-database.js";
const cfg={apiKey:"AIzaSyCvFGMyHt3Z15DkXjgP0bRwzcOR22kzy5o",authDomain:"darabingo.firebaseapp.com",databaseURL:"https://darabingo-default-rtdb.firebaseio.com",projectId:"darabingo",storageBucket:"darabingo.firebasestorage.app",messagingSenderId:"602699715656",appId:"1:602699715656:web:b20a1380d030dc7e75b47d"};
const ADMIN="PlCOAljMt8eStqqBxaNobXuqEH93",ROOM="DARA01",app=initializeApp(cfg),auth=getAuth(app),db=getDatabase(app),$=id=>document.getElementById(id);
let user=null,room={},stopRoom=null,card=[],marked=new Set([12]);
function pick(a,b){let x=Array.from({length:b-a+1},(_,i)=>a+i);for(let i=x.length-1;i>0;i--){let j=Math.random()*(i+1)|0;[x[i],x[j]]=[x[j],x[i]]}return x.slice(0,5)}
function newCard(){let c=[pick(1,15),pick(16,30),pick(31,45),pick(46,60),pick(61,75)];card=[];for(let r=0;r<5;r++)for(let k=0;k<5;k++)card.push(r===2&&k===2?"FREE":c[k][r]);marked=new Set([12]);draw();saveCard()}
function draw(){let g=$("grid");g.replaceChildren();card.forEach((n,i)=>{let b=document.createElement("button");b.className="cell"+(marked.has(i)?" marked":"")+(i===12?" free":"");b.textContent=n;b.onclick=()=>{if(i===12)return;let called=new Set(Object.values(room.calledNumbers||{}).map(Number));if(!called.has(Number(n))){$("message").textContent="ይህ ቁጥር ገና አልተጠራም።";return}marked.has(i)?marked.delete(i):marked.add(i);draw();saveCard()};g.append(b)})}
async function saveCard(){if(!user||card.length!==25)return;try{await set(ref(db,`rooms/${ROOM}/players/${user.uid}/card`),card);await set(ref(db,`rooms/${ROOM}/players/${user.uid}/marked`),[...marked])}catch(e){console.warn(e)}}
function showRoom(v){room=v||{};let p=room.players||{};$("players").textContent="ተጫዋቾች፦ "+Object.values(p).filter(x=>x&&x.joinedAt).length;let nums=Object.values(room.calledNumbers||{}).map(Number);$("called").replaceChildren();nums.forEach(n=>{let s=document.createElement("span");s.className="ball";s.textContent=n;$("called").append(s)});$("lastCall").textContent="የመጨረሻ ቁጥር፦ "+(nums.at(-1)??"—");$("roomStatus").textContent=room.status==="playing"?"ጨዋታው ተጀምሯል":"አስተዳዳሪውን ይጠብቁ";let a=user?.uid===ADMIN;$("start").classList.toggle("hidden",!a||room.status==="playing");$("call").classList.toggle("hidden",!a||room.status!=="playing");$("reset").classList.toggle("hidden",!a)}
async function enter(){let rr=ref(db,"rooms/"+ROOM);if(user.uid===ADMIN)await runTransaction(rr,v=>v||{hostUid:ADMIN,status:"waiting",players:{},calledNumbers:{}});await set(ref(db,`rooms/${ROOM}/players/${user.uid}/joinedAt`),Date.now());await set(ref(db,`rooms/${ROOM}/players/${user.uid}/email`),user.email||"Player");if(stopRoom)stopRoom();stopRoom=onValue(rr,s=>{if(s.exists())showRoom(s.val());else $("roomStatus").textContent="አስተዳዳሪው መጀመሪያ መግባት አለበት።"},e=>{$("roomStatus").textContent="Firebase Rules ፈቃድ ችግር።";console.error(e)});let s=await get(ref(db,`rooms/${ROOM}/players/${user.uid}/card`));if(s.exists()&&Array.isArray(s.val())){card=s.val();let m=await get(ref(db,`rooms/${ROOM}/players/${user.uid}/marked`));marked=new Set(m.exists()?m.val():[12]);marked.add(12);draw()}else newCard()}
$("signup").onclick=async()=>{try{await createUserWithEmailAndPassword(auth,$("email").value.trim(),$("password").value)}catch(e){$("authMsg").textContent=e.message}};
$("login").onclick=async()=>{try{await signInWithEmailAndPassword(auth,$("email").value.trim(),$("password").value)}catch(e){$("authMsg").textContent=e.message}};
$("logout").onclick=()=>signOut(auth);$("newCard").onclick=newCard;
$("start").onclick=async()=>{if(user?.uid===ADMIN)try{await update(ref(db,"rooms/"+ROOM),{status:"playing",calledNumbers:{},startedAt:Date.now()})}catch(e){$("adminMsg").textContent="Firebase Rules ያስተካክሉ"}};
$("call").onclick=async()=>{if(user?.uid!==ADMIN||room.status!=="playing")return;let old=Object.values(room.calledNumbers||{}).map(Number),avail=Array.from({length:75},(_,i)=>i+1).filter(n=>!old.includes(n));if(!avail.length){$("adminMsg").textContent="ሁሉም ቁጥሮች ተጠርተዋል";return}let n=avail[Math.random()*avail.length|0];try{await runTransaction(ref(db,"rooms/"+ROOM+"/calledNumbers"),v=>{v=v||{};v[String(Date.now())]=n;return v})}catch(e){$("adminMsg").textContent="Firebase Rules ያስተካክሉ"}};
$("reset").onclick=async()=>{if(user?.uid===ADMIN)await update(ref(db,"rooms/"+ROOM),{status:"waiting",calledNumbers:{},startedAt:null})};
function lines(){let x=[];for(let r=0;r<5;r++)x.push(Array.from({length:5},(_,c)=>r*5+c));for(let c=0;c<5;c++)x.push(Array.from({length:5},(_,r)=>r*5+c));x.push([0,6,12,18,24],[4,8,12,16,20]);return x}
$("check").onclick=()=>{let w=lines().find(line=>line.every(i=>marked.has(i)||i===12));if(!w){$("message").textContent="ገና Bingo አልሆነም";return}let called=new Set(Object.values(room.calledNumbers||{}).map(Number));$("message").textContent=w.every(i=>i===12||called.has(Number(card[i])))?"🎉 Bingo! የማሳያ ድል ተገኝቷል።":"በመስመሩ ያሉ ቁጥሮች ሁሉ መጠራት አለባቸው።"};
onAuthStateChanged(auth,async u=>{user=u;$("auth").classList.toggle("hidden",!!u);$("game").classList.toggle("hidden",!u);if(!u){if(stopRoom)stopRoom();stopRoom=null;return}$("welcome").textContent="እንኳን ደህና መጡ፣ "+(u.email||"Player");await enter()});
</script>
 </body>
</html>
